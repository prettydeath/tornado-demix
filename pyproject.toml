[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tornado-demix"
version = "1.0.0"
description = "Tornado.Cash (ETH) demixing toolkit via amount + timing correlation on public on-chain data."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "tornado-demix contributors" }]
keywords = ["ethereum", "tornado-cash", "blockchain", "forensics", "demixing", "etherscan"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Security",
]
dependencies = [
    "requests>=2.28",
]

[project.scripts]
tornado-demix = "tornado_demix.cli:main"

[project.urls]
Homepage = "https://github.com/YOUR_USERNAME/tornado-demix"
Issues = "https://github.com/YOUR_USERNAME/tornado-demix/issues"

[tool.setuptools]
packages = ["tornado_demix"]
